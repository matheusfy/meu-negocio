# Perfil de produção (Railway + Supabase), também usado ao rodar o jar empacotado fora do
# Gradle (spring-boot-docker-compose é developmentOnly e não vai pro jar, então o datasource
# precisa ser explícito aqui). Sem valores padrão de propósito: se faltar variável o app não
# sobe, em vez de tentar um banco errado. Nada de segredo no git.
# Ver planejamento_deploy_railway.md.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# O pooler do Supabase (plano free) limita o número de conexões por projeto.
spring.datasource.hikari.maximum-pool-size=5

# Sem isto o Spring não envia Cache-Control e o navegador (Safari/iOS em especial) reutiliza
# CSS/JS antigos por cache heurístico, mostrando a UI desatualizada após um deploy.
spring.web.resources.cache.cachecontrol.no-cache=true

# O Railway termina o HTTPS no proxy e repassa X-Forwarded-*; sem isto redirects e URLs
# geradas sairiam como http.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

spring.h2.console.enabled=false

# O Supabase já cria objetos no schema public (ex.: a função rls_auto_enable, que liga RLS em
# tabelas novas), e o Flyway se recusa a migrar um schema não vazio sem histórico. Baseline na
# versão 0 cria o histórico sem pular nenhuma migration: V1 em diante rodam normalmente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Em produção os usuários são obrigatórios (APP_SEGURANCA_USUARIOS_n_*); sem eles o app não sobe.
app.seguranca.permitir-usuario-temporario=false

# Só o health fica exposto; o Railway usa /actuator/health como healthcheck.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
