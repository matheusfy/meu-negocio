<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#AF5828">
  <title>Ateliê de Decantes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div><b>Ateliê</b><span>de Decantes</span></div>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <nav class="nav" id="nav" aria-label="Seções">
        <button data-go="inicio">Início</button>
        <button data-go="perfumes">Perfumes</button>
        <button data-go="marcas">Marcas</button>
        <button data-go="insumos">Insumos</button>
        <button data-go="estoque">Estoque</button>
        <button data-go="vendas">Vendas</button>
        <button data-go="viabilidade">Viabilidade</button>
      </nav>
      <p class="note">Simulador de viabilidade para venda de decantes de perfume.</p>
      <div class="conta">
        <span id="conta-nome" class="conta-nome"></span>
        <button type="button" class="btn ghost sm" id="sair">Sair</button>
      </div>
    </aside>
    <main class="main">
      <section class="screen" id="screen" aria-live="polite"></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=2"></script>
</body>
</html>
