spring.application.name=meu-negocio

# Porta e binding. 0.0.0.0 já é o padrão do Spring Boot; deixado explícito para
# documentar que o app aceita conexões de outros aparelhos da rede local
# (ver planejamento_acesso_rede_local.md).
# Railway injeta a porta em PORT; localmente cai no 8080.
server.port=${PORT:8080}
server.address=0.0.0.0

# Front-end estático em src/main/resources/static/ é servido na raiz (http://<ip>:8080/).

# Login: a sessão fica no banco (spring-session-jdbc) e dura 30 dias, para não pedir senha
# toda hora no celular. Usuários em app.seguranca.usuarios (ver SegurancaProperties); sem
# nenhum configurado, o log mostra um login temporário "admin" com senha aleatória.
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
