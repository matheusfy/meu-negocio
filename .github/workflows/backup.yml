name: Backup do banco

# Dump semanal do Postgres do Supabase (o plano free não tem backup baixável).
# O repositório é público e artefatos de repositório público podem ser baixados por qualquer
# pessoa logada no GitHub, então o dump sai criptografado (AES-256) antes do upload.
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL    URI do Session pooler (postgresql://postgres.<ref>:<senha>@...:5432/postgres?sslmode=require)
#   BACKUP_PASSPHRASE  frase para criptografar; guarde-a fora do GitHub, sem ela o backup é inútil
#
# Restaurar (com Docker):
#   gpg --decrypt meu-negocio-AAAAMMDD-HHMM.dump.gpg > backup.dump
#   docker run --rm -i -e URL="<uri destino>" postgres:18 sh -c 'pg_restore --no-owner --no-privileges -d "$URL"' < backup.dump
# (o erro 'schema "public" already exists' é esperado e inofensivo; o resto é restaurado.)
#
# Agendamentos só rodam a partir da branch padrão (main), e o GitHub pausa agendamentos de
# repositórios públicos sem atividade por 60 dias.
on:
  schedule:
    - cron: '0 6 * * 1'   # segunda-feira, 03:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Dump criptografado
    runs-on: ubuntu-latest
    steps:
      - name: Dump do banco e criptografia
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Configure os secrets SUPABASE_DB_URL e BACKUP_PASSPHRASE."
            exit 1
          fi
          arquivo="meu-negocio-$(date -u +%Y%m%d-%H%M).dump"
          # pg_dump 18 consegue ler servidores mais antigos (o Supabase roda 15-17).
          docker run --rm -e SUPABASE_DB_URL postgres:18 sh -c \
            'pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges --schema=public --exclude-table-data="spring_session*"' \
            > "$arquivo"
          test -s "$arquivo"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$arquivo.gpg" "$arquivo" <<< "$BACKUP_PASSPHRASE"
          rm "$arquivo"
          echo "ARQUIVO=$arquivo.gpg" >> "$GITHUB_ENV"
          ls -l "$arquivo.gpg"

      - name: Guardar backup (30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: backup-banco
          path: ${{ env.ARQUIVO }}
          retention-days: 30
          if-no-files-found: error
