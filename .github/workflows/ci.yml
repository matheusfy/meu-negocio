name: CI

# Gate de qualidade: roda em toda PR e push para develop/main.
# As branches develop e main devem exigir esses jobs como "required status
# checks" (Settings > Branches) para bloquear merge se algo falhar.
on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

defaults:
  run:
    working-directory: sistema-pedidos

jobs:
  build-and-test:
    name: Build & Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('sistema-pedidos/**/*.gradle*', 'sistema-pedidos/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Permissão de execução no gradlew
        run: chmod +x gradlew

      - name: Build e testes
        run: ./gradlew build

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: sistema-pedidos/build/reports/tests/test
          retention-days: 7

  lint:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('sistema-pedidos/**/*.gradle*', 'sistema-pedidos/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Permissão de execução no gradlew
        run: chmod +x gradlew

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Publicar relatório do checkstyle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-results
          path: sistema-pedidos/build/reports/checkstyle
          retention-days: 7
