name: CI

# Gate de qualidade: roda em toda PR e push para develop/main.
# As branches develop e main devem exigir esses jobs como "required status
# checks" (Settings > Branches) para bloquear merge se algo falhar.
on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

defaults:
  run:
    working-directory: sistema-pedidos

jobs:
  commit-lint:
    name: Commit Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Validar mensagens de commit (padrão [tipo]: descrição)"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -e
          git fetch origin "$BASE_REF" --depth=1
          pattern='^\[(feat|fix|docs|style|refactor|perf|test|chore|ci|build)(\([a-z0-9._-]+\))?\]: .{1,100}$'
          failed=0
          for sha in $(git rev-list --no-merges "origin/$BASE_REF..HEAD"); do
            msg=$(git log -1 --format=%s "$sha")
            if ! echo "$msg" | grep -Eq "$pattern"; then
              echo "::error::Commit $sha fora do padrão: \"$msg\""
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "Padrão esperado: [tipo]: descrição   (ou [tipo(escopo)]: descrição)"
            echo "Tipos válidos: feat, fix, docs, style, refactor, perf, test, chore, ci, build"
            echo "Exemplo: [feat]: adiciona cancelamento de pedido"
            exit 1
          fi

  build-and-test:
    name: Build & Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('sistema-pedidos/**/*.gradle*', 'sistema-pedidos/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Permissão de execução no gradlew
        run: chmod +x gradlew

      - name: Build e testes
        run: ./gradlew build

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: sistema-pedidos/build/reports/tests/test
          retention-days: 7

  lint:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('sistema-pedidos/**/*.gradle*', 'sistema-pedidos/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Permissão de execução no gradlew
        run: chmod +x gradlew

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Publicar relatório do checkstyle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-results
          path: sistema-pedidos/build/reports/checkstyle
          retention-days: 7
